name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      # Release `gate` calls this workflow — quality must always run there.
      # Standalone push CI skips when Cargo.toml changed (Release already covers it).
      from_release:
        description: Set true when invoked as Release gate
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    # Skip only the standalone push run if the commit touches Cargo.toml (version bump):
    # Release workflow already runs this as `gate`.
    if: >-
      inputs.from_release == true ||
      github.event_name != 'push' ||
      (
        !contains(github.event.head_commit.modified, 'Cargo.toml') &&
        !contains(github.event.head_commit.added, 'Cargo.toml')
      )
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: cargo fmt
        run: cargo fmt --check

      # --all-targets is required: integration tests under crates/*/tests/ are
      # otherwise never linted (same rule as AGENTS.md local gate).
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: web install
        run: bun install --cwd web --frozen-lockfile

      - name: web lint
        run: bun run --cwd web lint

      - name: web build
        run: bun run --cwd web build

  # Compile-check the desktop client (CLI + GUI feature) on every OS we ship.
  client-check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-13
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libgtk-3-dev libayatana-appindicator3-dev \
            libxkbcommon-dev libwayland-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: client-${{ matrix.target }}

      - name: cargo test (client)
        run: cargo test -p rustcache-client

      - name: cargo clippy (client, gui)
        run: cargo clippy -p rustcache-client --features gui --all-targets -- -D warnings

      - name: cargo build (client, gui)
        run: cargo build -p rustcache-client --release --features gui

      - name: Smoke --help
        shell: bash
        run: |
          BIN="target/release/rustcache-client"
          if [ -f "${BIN}.exe" ]; then BIN="${BIN}.exe"; fi
          "$BIN" --help
          "$BIN" config path
