name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  # Build the desktop client (CLI + GUI feature) on every OS we ship.
  # macOS runners are excluded: capacity queues stall the matrix for hours.
  client-check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libgtk-3-dev libayatana-appindicator3-dev \
            libxkbcommon-dev libwayland-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libxdo-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: client-${{ matrix.target }}

      - name: cargo build (client, gui)
        run: cargo build -p rustcache-client --release --features gui

      - name: Smoke --help
        shell: bash
        run: |
          BIN="target/release/rustcache-client"
          if [ -f "${BIN}.exe" ]; then BIN="${BIN}.exe"; fi
          "$BIN" --help
          "$BIN" config path
