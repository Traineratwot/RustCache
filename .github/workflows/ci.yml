name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      # Release `gate` calls this workflow — quality must always run there.
      # Standalone push CI skips when Cargo.toml changed (Release already covers it).
      from_release:
        description: Set true when invoked as Release gate
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    # Skip only the standalone push run if the commit touches Cargo.toml (version bump):
    # Release workflow already runs this as `gate`.
    if: >-
      inputs.from_release == true ||
      github.event_name != 'push' ||
      (
        !contains(github.event.head_commit.modified, 'Cargo.toml') &&
        !contains(github.event.head_commit.added, 'Cargo.toml')
      )
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --workspace -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: web install
        run: bun install --cwd web --frozen-lockfile

      - name: web lint
        run: bun run --cwd web lint

      - name: web build
        run: bun run --cwd web build
