name: Release

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
  workflow_dispatch:
    inputs:
      force:
        description: Build and publish even if tag for current version already exists
        type: boolean
        default: true
      build_only:
        description: Run quality+build only (skip Release / apt-repo / docker publish)
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      should_release: ${{ steps.meta.outputs.should_release }}
      build_only: ${{ steps.meta.outputs.build_only }}
      force_release: ${{ steps.meta.outputs.force_release }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from Cargo.toml
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_FORCE: ${{ inputs.force }}
          INPUT_BUILD_ONLY: ${{ inputs.build_only }}
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml','rb'))['workspace']['package']['version'])")
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$INPUT_BUILD_ONLY" = "true" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "build_only=true" >> "$GITHUB_OUTPUT"
            echo "Manual build-only run for ${TAG} (no publish)."
            exit 0
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$INPUT_FORCE" = "true" ]; then
              echo "should_release=true" >> "$GITHUB_OUTPUT"
              echo "force_release=true" >> "$GITHUB_OUTPUT"
              echo "Tag ${TAG} exists — force manual release."
            else
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              echo "Tag ${TAG} already exists — skipping release."
            fi
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "Will release ${TAG}."
          fi

  gate:
    needs: version
    if: needs.version.outputs.should_release == 'true'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: [version, gate]
    if: needs.version.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            deb_arch: amd64
            platform: linux/amd64
          - os: ubuntu-22.04-arm
            deb_arch: arm64
            platform: linux/arm64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Build web UI
        run: |
          bun install --cwd web --frozen-lockfile
          bun run --cwd web build

      - name: Build binary (embed-ui)
        run: cargo build --release --features embed-ui

      - name: Sanity check binary
        run: ./target/release/rustcache --help

      - name: Build .deb
        run: ./packaging/scripts/build-deb.sh "${{ needs.version.outputs.version }}" "${{ matrix.deb_arch }}"

      - name: Build tar.gz
        env:
          VERSION: ${{ needs.version.outputs.version }}
          DEB_ARCH: ${{ matrix.deb_arch }}
        run: |
          STAGE="dist/rustcache-${VERSION}-linux-${DEB_ARCH}"
          mkdir -p "$STAGE"
          cp target/release/rustcache config.example.toml "$STAGE/"
          tar -C dist -czf "dist/rustcache_${VERSION}_linux_${DEB_ARCH}.tar.gz" "rustcache-${VERSION}-linux-${DEB_ARCH}"
          rm -rf "$STAGE"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.deb_arch }}
          path: |
            dist/*.deb
            dist/*.tar.gz
          if-no-files-found: error

      - name: Prepare binary for Docker
        run: cp target/release/rustcache rustcache-bin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=raw,value=${{ needs.version.outputs.tag }}
            type=raw,value=latest

      # Dockerfile is packaging-only: copies the binary built above (no second cargo/web build)
      - name: Build and push by digest
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=${{ needs.version.outputs.build_only != 'true' }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.docker_build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: docker-digest-${{ matrix.deb_arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-manifest:
    needs: [version, build]
    if: needs.version.outputs.should_release == 'true' && needs.version.outputs.build_only != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
    steps:
      - name: Set lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          pattern: docker-digest-*
          path: /tmp/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create multi-arch manifest and push
        working-directory: /tmp/digests
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          IMAGE="${REGISTRY}/${IMAGE_NAME}"
          sources=()
          for f in *; do
            sources+=("${IMAGE}@sha256:${f}")
          done
          docker buildx imagetools create \
            -t "${IMAGE}:${VERSION}" \
            -t "${IMAGE}:${TAG}" \
            -t "${IMAGE}:latest" \
            "${sources[@]}"

      - name: Inspect image
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          docker buildx imagetools inspect "${REGISTRY}/${IMAGE_NAME}:${TAG}"

  release:
    needs: [version, build]
    if: needs.version.outputs.should_release == 'true' && needs.version.outputs.build_only != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum *.deb *.tar.gz > SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          FORCE: ${{ needs.version.outputs.force_release }}
        run: |
          if [ "$FORCE" = "true" ]; then
            gh release delete "${TAG}" --yes || true
            git push origin ":refs/tags/${TAG}" 2>/dev/null || true
          fi
          gh release create "${TAG}" \
            --target "${GITHUB_SHA}" \
            --title "${TAG}" \
            --generate-notes \
            dist/*.deb dist/*.tar.gz dist/SHA256SUMS

  apt-repo:
    needs: [version, build]
    if: needs.version.outputs.should_release == 'true' && needs.version.outputs.build_only != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Materialize site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # keep accumulated pool/ from previous gh-pages
          git clone --depth 1 --branch gh-pages \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" site \
            || (mkdir -p site && git -C site init && git -C site checkout --orphan gh-pages)
          mkdir -p site/pool
          cp dist/*.deb site/pool/
          # static site source lives in pages/ (index.html + style.css)
          cp pages/index.html pages/style.css site/

      - name: Regenerate apt index and package list
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dpkg-dev
          cd site
          dpkg-scanpackages --multiversion pool /dev/null > Packages
          gzip -9c Packages > Packages.gz
          printf '%s\n' \
            'Origin: RustCache' \
            'Label: RustCache' \
            'Architectures: amd64 arm64' \
            'Description: RustCache apt repository' \
            > Release
          # fill <!-- PACKAGES --> on the landing page
          {
            echo '<ul class="packages">'
            for f in pool/*.deb; do
              [ -e "$f" ] || continue
              base=$(basename "$f")
              # rustcache_0.1.0_amd64.deb → 0.1.0 / amd64
              ver=$(echo "$base" | sed -n 's/^rustcache_\(.*\)_.*\.deb$/\1/p')
              arch=$(echo "$base" | sed -n 's/^.*_\(amd64\|arm64\)\.deb$/\1/p')
              size=$(du -h "$f" | cut -f1)
              printf '<li><a class="name" href="%s">%s</a><span class="meta">%s · %s</span></li>\n' \
                "$f" "$base" "$arch" "$size"
            done
            echo '</ul>'
          } > /tmp/packages.html
          python3 - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text()
          block = Path("/tmp/packages.html").read_text()
          Path("index.html").write_text(html.replace("<!-- PACKAGES -->", block))
          PY

      - name: Push gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cd site
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "apt: add rustcache ${VERSION}" --allow-empty
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
