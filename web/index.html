<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RustCache</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="preload" as="style" href="/themes/lara-light-indigo.css" />
    <link rel="preload" as="style" href="/themes/lara-dark-indigo.css" />
    <link id="pt-theme" rel="stylesheet" href="/themes/lara-light-indigo.css" />
    <script>
      (function () {
        try {
          var mode = localStorage.getItem("rustcache.theme") || "auto";
          var dark =
            mode === "dark" ||
            (mode === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          var href = dark
            ? "/themes/lara-dark-indigo.css"
            : "/themes/lara-light-indigo.css";
          document.getElementById("pt-theme").href = href;
          document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");

          var lm = localStorage.getItem("rustcache.lang") || "auto";
          var lang =
            lm === "ru" || lm === "en"
              ? lm
              : (navigator.language || "en").toLowerCase().indexOf("ru") === 0
                ? "ru"
                : "en";
          document.documentElement.lang = lang;
        } catch (e) {
          /* keep defaults */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
