# RustCache example configuration

[http]
port = 3128

[https]
port = 3129

[socks5]
port = 1080

[api]
bind = "127.0.0.1:8080"

[cache]
dir = "~/.local/share/rustcache/cache"
max_bytes = 2147483648
max_object_bytes = 52428800

[exclude]
domains = ["*.local", "bank.example", "exact.host"]
cidrs = ["192.168.0.0/16", "10.0.0.0/8"]

[ca]
dir = "~/.local/share/rustcache/ca"

[logs]
db_path = "~/.local/share/rustcache/logs.db"
max_rows = 10000
max_age_days = 7
cleanup_interval_secs = 300

[pac]
enabled = true
bind = "0.0.0.0:8081"
mode = "http+socks"   # "http" | "socks" | "http+socks"
