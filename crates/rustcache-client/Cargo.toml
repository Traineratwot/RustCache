[package]
name = "rustcache-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Cross-platform desktop client: CA install, system proxy, resilient upstream to RustCache"

[[bin]]
name = "rustcache-client"
path = "src/main.rs"

[features]
default = []
gui = ["dep:eframe", "dep:egui", "dep:tray-icon", "dep:image"]
tun = ["dep:tun", "dep:smoltcp", "dep:nix", "dep:libc"]

[dependencies]
anyhow.workspace = true
clap.workspace = true
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
hex.workspace = true
parking_lot.workspace = true

# GUI (optional): tray + status window
eframe = { version = "0.31", optional = true, default-features = true, features = ["default_fonts", "glow"] }
egui = { version = "0.31", optional = true }
tray-icon = { version = "0.19", optional = true }
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }

# TUN (optional): TCP-only capture via virtual interface
tun = { version = "0.7", optional = true, features = ["async"] }
smoltcp = { version = "0.12", optional = true, default-features = false, features = ["std", "medium-ip", "proto-ipv4", "socket-tcp", "socket-udp"] }
nix = { version = "0.29", optional = true, features = ["net"] }
libc = { version = "0.2", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
